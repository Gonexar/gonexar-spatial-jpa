name: CI

on:
  pull_request:
  push:
    branches: [master, developer, "release/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build publishToMavenLocal --no-configuration-cache
